[project]
name = "support-rag-evals"
version = "0.1.0"
description = "Synthetic customer-support RAG assistant with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Mustafa" }]
dependencies = [
  "ragas==0.4.3",
  # ragas 0.4.3 imports langchain_community.chat_models.vertexai at import time.
  # That module was removed in langchain-community 0.3.23. 0.3.22 is the last
  # release that still ships it, and it requires the LangChain 0.3 line.
  "langchain-community==0.3.22",
  "langchain>=0.3.27,<1",
  "langchain-core>=0.3.80,<1",
  "langchain-openai>=0.3.35,<1",
  "openai>=1.50",
  "anthropic>=0.40",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_rag"]

[tool.hatch.build.targets.sdist]
include = ["src/support_rag", "data", "config", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["support_rag"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Importing NonLLMContextRecall:DeprecationWarning",
]
