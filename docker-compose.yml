services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sable
      POSTGRES_PASSWORD: sable
      POSTGRES_DB: sableboard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sable -d sableboard"]
      interval: 5s
      timeout: 5s
      retries: 10
